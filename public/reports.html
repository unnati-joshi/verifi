<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Reports · verifi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header id="app-header" class="topbar"><div class="container"></div></header>
  <main class="page"><div class="container">
    <div class="page-head">
      <div><h1>Reports</h1><p id="count-label">Your saved reports.</p></div>
      <a class="btn btn-primary" href="/analyze.html">New check</a>
    </div>
    <div class="panel">
      <form class="filters" id="filters">
        <input class="input" type="search" name="q" placeholder="Search by name" aria-label="Search">
        <select class="input" name="type" aria-label="Product">
          <option value="">All products</option><option value="loan">Loans</option><option value="insurance">Insurance</option><option value="upi">UPI</option>
        </select>
        <select class="input" name="grade" aria-label="Grade">
          <option value="">All grades</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option>
        </select>
      </form>
      <div class="table-wrap" id="table"><div class="skeleton mid"></div></div>
      <div class="pager" id="pager"></div>
    </div>
  </div></main>
  <script type="module" src="/js/pages/reports.js"></script>
</body>
</html>
